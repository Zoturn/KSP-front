schema: spec-driven

context: |
  Project: KSP - E-Commerce Storefront UI
  Purpose: React web UI for the KSP e-commerce catalog — browse products, navigate
  categories, and later cart/checkout/account.
  App root: ksp-frontend/
  Nature: Clarity outranks cleverness — every component ships with tests AND a written
  explanation, and Tailwind concepts are explained the first time they appear.

  Tech stack:
    - Runtime/tooling: Node >= 24.9 (same floor as the backend), Vite, TypeScript
    - UI: React + React Testing Library. NOT MUI or any component library — Tailwind only,
      with our own primitives. This was decided explicitly and reversed once; do not
      reintroduce a component library without raising it first
    - Styling: Tailwind CSS, utility-first, driven by design TOKENS rather than ad-hoc values
    - Server state: TanStack Query — all of it. No useEffect + fetch data fetching
    - API client: GENERATED by graphql-codegen. Never hand-written
    - Testing: Vitest + React Testing Library (component and hook tests)

  Sister repo and the contract:
    - ksp-backend is GraphQL-ONLY: one endpoint, POST /graphql. There is no REST API and no
      OpenAPI spec. The only REST routes are /api/health and /api/uploads/*
    - This repo generates its ENTIRE typed client from ksp-backend's committed schema.gql:
      backend decorators -> schema.gql (committed) -> graphql-codegen -> typed documents
    - Generate from the committed FILE, never a live URL. Introspection is disabled in
      production, so a URL-based config works in dev and fails in CI
    - If the backend schema changes, this repo fails to compile. That is the safety net
      working, not a bug
    - Generated output lives in src/api/generated/ and is never edited by hand. The
      post-commit review hook deliberately ignores it as build output

  Two GraphQL habits that differ from REST:
    - Failures from resolvers and guards arrive with HTTP 200, reported in the errors array
      with errors[0].extensions.code (UNAUTHENTICATED / FORBIDDEN / NOT_FOUND / ...). Never
      branch on HTTP status. data and errors can coexist — render what resolved.
      (The one exception, verified against the server: a document that fails parse or schema
      validation returns 400. That is a malformed request, not something the UI produces.)
    - Select only the fields the component renders. Over-selecting silently costs backend
      work and, with DataLoader relations, extra queries

  Conventions (detail in this repo's own .claude/rules/):
    - Money arrives as INTEGER MINOR UNITS (price_cents + currency). Format with
      Intl.NumberFormat at display time only; never do currency arithmetic in floats
    - Loading, error and empty states are handled EXPLICITLY — an unhandled error state is
      a bug, not an omission
    - Client-only UI state (modals, drafts, toggles) stays in useState. Server data never does
    - Tailwind: tokens first; explain each new concept the first time it is used
    - Accessibility is not a later pass — semantic elements, labelled controls, keyboard paths
    - Import order is enforced by @trivago/prettier-plugin-sort-imports

  Local notes:
    - Durable concepts are captured in LEARNING/NN-topic.md (00-tailwind.md already exists)
    - LEARNING/ is GITIGNORED — the notes are personal working material, so a task that
      writes one records that fact rather than expecting the file in a diff
    - Path-scoped conventions live in THIS repo's own .claude/rules/ (frontend.md,
      tailwind.md, testing.md) so they travel when the repo is cloned alone

  Sequencing constraint that shapes every proposal here:
    - The backend's committed schema.gql currently exposes ONE field, apiStatus. Catalog
      types (Product, Category, ProductImage) do not exist in the contract until the
      backend's catalog-read-model change lands
    - So UI typed against catalog data is BLOCKED, while scaffold, design system, app shell,
      TanStack Query wiring and codegen setup are not
    - Never hand-write a placeholder type to "unblock" a catalog component. That defeats the
      generated contract and guarantees rework

rules:
  proposal:
    - State plainly which parts of the work the backend contract currently blocks, and which
      it does not — this repo's sequencing depends on schema.gql, not on preference
    - State the user-visible capability and the why before the what
    - Include a "Non-goals" section to prevent scope creep
    - Call out explicitly if anything would hand-write a type that codegen should own
  design:
    - Name the specific React/Tailwind/TanStack Query concepts the change introduces — the
      explanation is part of the deliverable, and Tailwind's token rules are easy to get wrong
    - Show the token/theme impact for any visual decision, not just the component list
    - 'State the query-key strategy and cache invalidation for anything touching server state'
  tasks:
    - Every task that adds a component must include writing its tests in the same task
    - 'Each task must be independently verifiable: a Vitest run, a visible result in the dev
      server, or a committed generated artifact'
    - Break work into chunks of max ~2 hours
    - Include an explicit verification step per task group
    - End with a task to write or update the relevant LEARNING/NN-topic.md note, noting that
      LEARNING/ is gitignored so only the record of it appears in the diff
  spec:
    - Specs live under openspec/specs/<capability>/ and describe observable UI behavior, not
      component structure
    - 'Describe states explicitly: loading, empty, error, and success are four behaviors, not
      one — the error case is the one most often left unspecified'
    - Describe keyboard and screen-reader behavior where it is part of the capability
    - Never describe behavior that depends on backend fields not yet in schema.gql

operations:
  apply:
    guidance:
      - Explain each Tailwind and TanStack Query concept the first time it appears
      - Never hand-edit anything under src/api/generated/ — regenerate instead
      - Pair each component with its tests before moving to the next
      - Run the generator after any backend schema change and let the type errors guide you
  archive:
    guidance:
      - Confirm tests pass and the LEARNING note exists before archiving
